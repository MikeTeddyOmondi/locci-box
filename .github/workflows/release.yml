name: Release

on:
  push:
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-cli:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            os: linux
            arch: x64
            ext: ""
            runner: ubuntu-latest
          - target: bun-linux-arm64
            os: linux
            arch: arm64
            ext: ""
            runner: ubuntu-latest
          - target: bun-darwin-arm64
            os: macos
            arch: arm64
            ext: ""
            runner: macos-latest
          - target: bun-windows-x64
            os: windows
            arch: x64
            ext: ".exe"
            runner: ubuntu-latest
          - target: bun-windows-arm64
            os: windows
            arch: arm64
            ext: ".exe"
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install CLI dependencies
        run: bun install --frozen-lockfile
        working-directory: cli

      - name: Build binary (${{ matrix.os }}-${{ matrix.arch }})
        run: |
          bun build --compile \
            --target=${{ matrix.target }} \
            --outfile=dist/loccibox-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} \
            src/index.ts
        working-directory: cli

      - name: Sign macOS binary (ad-hoc)
        if: matrix.os == 'macos'
        run: codesign --force --deep --sign - cli/dist/loccibox-macos-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: loccibox-${{ matrix.os }}-${{ matrix.arch }}
          path: cli/dist/loccibox-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract version tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            locci/box-api:latest
            locci/box-api:${{ steps.tag.outputs.version }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: |
            locci/box-web:latest
            locci/box-web:${{ steps.tag.outputs.version }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Build and push CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./cli/Dockerfile
          push: true
          tags: |
            locci/box-cli:latest
            locci/box-cli:${{ steps.tag.outputs.version }}

  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: cli

      - name: Build CLI
        run: pnpm build
        working-directory: cli

      - name: Publish @locci/box to NPM
        run: pnpm publish --no-git-checks
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: [build-cli, docker, npm-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: loccibox-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd dist
          sha256sum loccibox-* > checksums.sha256
          echo "--- checksums ---"
          cat checksums.sha256

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent

      - name: Sign all binaries with GPG
        env:
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          cd dist
          for f in loccibox-*; do
            echo "$GPG_PASSPHRASE" | gpg --batch --yes \
              --passphrase-fd 0 \
              --pinentry-mode loopback \
              --detach-sign --armor "$f"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/loccibox-*
            dist/checksums.sha256
          body: |
            ## Locci Box ${{ github.ref_name }}

            ### Docker

            ```bash
            # API
            docker pull locci/box-api:${{ github.ref_name }}

            # Web
            docker pull locci/box-web:${{ github.ref_name }}

            # CLI
            docker pull locci/box-cli:${{ github.ref_name }}
            docker run --rm \
              -e LOCCIBOX_API_URL=https://box.locci.cloud \
              -e LOCCIBOX_API_KEY=lbk_live_... \
              locci/box-cli:${{ github.ref_name }} --help
            ```

            ### CLI Binaries

            | Platform | Architecture | Download |
            |----------|-------------|---------|
            | Linux | x64 | [loccibox-linux-x64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/loccibox-linux-x64) |
            | Linux | arm64 | [loccibox-linux-arm64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/loccibox-linux-arm64) |
            | macOS | arm64 | [loccibox-macos-arm64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/loccibox-macos-arm64) |
            | Windows | x64 | [loccibox-windows-x64.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/loccibox-windows-x64.exe) |
            | Windows | arm64 | [loccibox-windows-arm64.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/loccibox-windows-arm64.exe) |

            ### Verify integrity

            Each binary has a GPG detached signature (`.asc`) and a SHA256 checksum.

            ```bash
            # Verify checksum
            sha256sum -c checksums.sha256

            # Verify GPG signature (import public key first)
            gpg --verify loccibox-linux-x64.asc loccibox-linux-x64
            ```
