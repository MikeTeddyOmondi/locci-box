# JuiceFS persistent volumes, opt-in on top of compose.yaml (rootful Docker):
#
#   docker compose -f compose.yaml -f compose.jfs.yaml up -d
#
# Data blocks live in an external S3-compatible store (RUSTFS_* in .env); only
# Valkey (metadata) and the JuiceFS client run here. The juicefs container
# mounts /mnt/locci-box and shares it with the api through shared propagation,
# so the host path must be a shared mount first (docs/DEPLOYMENT.md, 4A).
# Rootless Docker cannot propagate that mount: use compose.rootless.yml.
services:
  api:
    environment:
      JFS_ENABLED: ${JFS_ENABLED:-true}
      JFS_ROOT: /mnt/locci-box
      JFS_QUOTA_MIB: ${JFS_QUOTA_MIB:-512}
    volumes:
      - /mnt/locci-box:/mnt/locci-box:shared
    depends_on:
      - juicefs

  valkey:
    image: valkey/valkey:8.0.2
    container_name: locci-box-valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes --appendfsync everysec
    volumes:
      - valkey-data:/data
    networks:
      - default

  juicefs-init:
    # One-shot: formats the JuiceFS volume if not already done.
    # Safe to re-run: exits 0 if the volume already exists.
    # NOTE: juicedata/juicefs:latest is a Docker *plugin*, not a runnable image;
    # the JuiceFS CE client image is juicedata/mount:ce-vX.Y.Z.
    image: juicedata/mount:ce-v1.3.1
    container_name: locci-box-jfs-init
    depends_on:
      - valkey
    entrypoint:
      - sh
      - -c
      - |
        juicefs format \
          --storage s3 \
          --bucket ${RUSTFS_ENDPOINT:-http://rustfs:9000}/${JFS_BUCKET:-locci-box} \
          --access-key ${RUSTFS_ACCESS_KEY} \
          --secret-key ${RUSTFS_SECRET_KEY} \
          redis://valkey:6379/2 \
          locci-box 2>&1 | grep -v "already exists" || true
    networks:
      - default

  juicefs:
    # Long-running FUSE daemon. Mounts /mnt/locci-box on the host via shared propagation.
    image: juicedata/mount:ce-v1.3.1
    container_name: locci-box-jfs
    restart: unless-stopped
    depends_on:
      juicefs-init:
        condition: service_completed_successfully
    privileged: true
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /mnt/locci-box && \
        juicefs mount \
          --enable-xattr \
          --cache-dir /var/jfs-cache \
          --cache-size 10240 \
          --writeback \
          --background \
          redis://valkey:6379/2 \
          /mnt/locci-box && \
        tail -f /dev/null
    volumes:
      - jfs-cache:/var/jfs-cache
      - /mnt/locci-box:/mnt/locci-box:shared
    networks:
      - default

volumes:
  valkey-data:
    name: locci-box-valkey-data
    driver: local
  jfs-cache:
    name: locci-box-jfs-cache
    driver: local
