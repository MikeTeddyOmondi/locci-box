services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: locci/box-api
    container_name: locci-box-api
    restart: unless-stopped
    ports:
      - "${PORT:-5757}:5757"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5757
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_MAX_CONCURRENT_SANDBOXES: ${DEFAULT_MAX_CONCURRENT_SANDBOXES:-5}
      DEFAULT_SANDBOX_TIMEOUT_SECONDS: ${DEFAULT_SANDBOX_TIMEOUT_SECONDS:-30}
      DEFAULT_RATE_LIMIT_PER_MINUTE: ${DEFAULT_RATE_LIMIT_PER_MINUTE:-60}
      DATABASE_MODE: ${DATABASE_MODE:-pglite}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_PATH: /app/data/locci-box
      MCP_HTTP_ENABLED: ${MCP_HTTP_ENABLED:-false}
      JFS_ENABLED: ${JFS_ENABLED:-false}
      JFS_ROOT: /mnt/locci-box
      JFS_QUOTA_MIB: ${JFS_QUOTA_MIB:-512}
    volumes:
      - db-data:/app/data
      # JuiceFS FUSE mount (shared propagation from the juicefs container)
      - /mnt/locci-box:/mnt/locci-box:shared
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5757/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy-network
      - default

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5757}
        # Fallback credential bundled into the web client (same as the API admin key).
        VITE_API_KEY: ${ADMIN_API_KEY}
    image: locci/box-web
    container_name: locci-box-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4173}:4173"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      VITE_API_URL: http://api:5757
    networks:
      - proxy-network
      - default

  cli:
    build:
      context: .
      dockerfile: cli/Dockerfile
    image: locci/box-cli
    container_name: locci-box-cli
    profiles:
      - cli
    environment:
      LOCCIBOX_API_URL: ${LOCCIBOX_API_URL:-http://api:5757}
      LOCCIBOX_API_KEY: ${ADMIN_API_KEY}
    entrypoint: ["loccibox"]
    command: ["--help"]

  postgres:
    image: postgres:17-alpine
    container_name: locci-box-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loccibox
      POSTGRES_USER: locci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default
    profiles:
      - prod-db

  # ── JuiceFS persistent volumes (opt-in: docker compose --profile jfs up -d) ──
  # Data blocks live in an external S3-compatible store (RUSTFS_* below); only
  # Valkey (metadata) + the JuiceFS client run here.
  valkey:
    image: valkey/valkey:8.0.2
    container_name: locci-box-valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes --appendfsync everysec
    volumes:
      - valkey-data:/data
    networks:
      - default
    profiles:
      - jfs

  juicefs-init:
    # One-shot: formats the JuiceFS volume if not already done.
    # Safe to re-run — exits 0 if the volume already exists.
    # NOTE: juicedata/juicefs:latest is a Docker *plugin*, not a runnable image —
    # the JuiceFS CE client image is juicedata/mount:ce-vX.Y.Z.
    image: juicedata/mount:ce-v1.3.1
    container_name: locci-box-jfs-init
    depends_on:
      - valkey
    entrypoint:
      - sh
      - -c
      - |
        juicefs format \
          --storage s3 \
          --bucket ${RUSTFS_ENDPOINT:-http://rustfs:9000}/${JFS_BUCKET:-locci-box} \
          --access-key ${RUSTFS_ACCESS_KEY} \
          --secret-key ${RUSTFS_SECRET_KEY} \
          redis://valkey:6379/2 \
          locci-box 2>&1 | grep -v "already exists" || true
    networks:
      - default
    profiles:
      - jfs

  juicefs:
    # Long-running FUSE daemon. Mounts /mnt/locci-box on the host via shared propagation.
    image: juicedata/mount:ce-v1.3.1
    container_name: locci-box-jfs
    restart: unless-stopped
    depends_on:
      juicefs-init:
        condition: service_completed_successfully
    privileged: true
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /mnt/locci-box && \
        juicefs mount \
          --enable-xattr \
          --cache-dir /var/jfs-cache \
          --cache-size 10240 \
          --writeback \
          --background \
          redis://valkey:6379/2 \
          /mnt/locci-box && \
        tail -f /dev/null
    volumes:
      - jfs-cache:/var/jfs-cache
      - /mnt/locci-box:/mnt/locci-box:shared
    networks:
      - default
    profiles:
      - jfs

volumes:
  db-data:
    name: locci-box-db-data
    driver: local
  postgres-data:
    name: locci-box-pg-data
    driver: local
  valkey-data:
    name: locci-box-valkey-data
    driver: local
  jfs-cache:
    name: locci-box-jfs-cache
    driver: local

networks:
  proxy-network:
    external: true
  default:
    name: locci-box-default
