services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: locci/box-api
    container_name: locci-box-api
    restart: unless-stopped
    ports:
      - "${PORT:-5757}:5757"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5757
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      # Locci Auth: its access tokens and Locci API keys are accepted as a login.
      LOCCI_AUTH_ISSUER: ${LOCCI_AUTH_ISSUER:-}
      LOCCI_AUTH_INTERNAL_ORIGIN: ${LOCCI_AUTH_INTERNAL_ORIGIN:-}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_MAX_CONCURRENT_SANDBOXES: ${DEFAULT_MAX_CONCURRENT_SANDBOXES:-5}
      DEFAULT_SANDBOX_TIMEOUT_SECONDS: ${DEFAULT_SANDBOX_TIMEOUT_SECONDS:-30}
      DEFAULT_RATE_LIMIT_PER_MINUTE: ${DEFAULT_RATE_LIMIT_PER_MINUTE:-60}
      DATABASE_MODE: ${DATABASE_MODE:-pglite}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_PATH: /app/data/locci-box
      MCP_HTTP_ENABLED: ${MCP_HTTP_ENABLED:-false}
    volumes:
      - db-data:/app/data
      # microsandbox's image cache and agent boxes' disks: kept across
      # redeploys, so stopped boxes keep their installs and the image is pulled once.
      - msb-data:/root/.microsandbox
      # JuiceFS (its mount and JFS_* settings) is opt-in: add -f compose.jfs.yaml.
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5757/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - proxy-network
      - default

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: locci/box-web
    container_name: locci-box-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4173}:4173"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # The console's public address: SvelteKit checks it on form and remote calls.
      ORIGIN: ${WEB_ORIGIN:-http://localhost:4173}
      LOCCI_BOX_API_URL: http://api:5757
      PUBLIC_LOCCI_BOX_API_URL: ${PUBLIC_LOCCI_BOX_API_URL:-http://localhost:5757}
      # Locci Auth, as locci-platform names it. INTERNAL_ORIGIN when the issuer's
      # address (localhost in development) is not reachable from the container.
      PUBLIC_OPENAUTH_ISSUER: ${LOCCI_AUTH_ISSUER:-http://localhost:8787}
      PUBLIC_OPENAUTH_CLIENT_ID: ${OPENAUTH_CLIENT_ID:-locci-box}
      LOCCI_AUTH_INTERNAL_ORIGIN: ${LOCCI_AUTH_INTERNAL_ORIGIN:-}
    networks:
      - proxy-network
      - default

  cli:
    build:
      context: .
      dockerfile: cli/Dockerfile
    image: locci/box-cli
    container_name: locci-box-cli
    profiles:
      - cli
    environment:
      LOCCIBOX_API_URL: ${LOCCIBOX_API_URL:-http://api:5757}
      LOCCIBOX_API_KEY: ${ADMIN_API_KEY}
    entrypoint: ["loccibox"]
    command: ["--help"]

  postgres:
    image: postgres:17-alpine
    container_name: locci-box-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loccibox
      POSTGRES_USER: locci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default
    profiles:
      - prod-db

volumes:
  db-data:
    name: locci-box-db-data
    driver: local
  msb-data:
    name: locci-box-msb-data
    driver: local
  postgres-data:
    name: locci-box-pg-data
    driver: local

networks:
  proxy-network:
    external: true
  default:
    name: locci-box-default
